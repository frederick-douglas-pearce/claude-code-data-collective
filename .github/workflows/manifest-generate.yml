name: Generate manifest rows

# Post-merge manifest generation (issue #33). The PR contribution gate
# (contribution-gate.yml / ci/validate_contribution.py) is validate-only: it
# re-derives the would-be manifest row but cannot write it, because a row's
# `contributed_at` is the MERGE-COMMIT date, which does not exist pre-merge. This
# workflow runs AFTER merge, on push to main, and writes the row.
#
#   generate:    on push to main touching a tier tree — re-validate each newly-merged
#                contribution through the gate's own code path, stamp each row's
#                per-path merge-commit date, and commit the appended manifest back.
#   drift-check: scheduled safety net — assert every contribution on disk is indexed
#                (catches a generate run that was skipped or whose push was rejected).
#
# The trigger excludes manifest.jsonl on purpose: the bot's manifest-only commit must
# not re-trigger this workflow (loop break). `concurrency` serializes pushes so two
# merges never race on the index.
#
# ── INFRA PREREQUISITE (branch protection) — DECISION OF RECORD (#35) ────────────────
# The generate job pushes manifest.jsonl directly to main (the index is CI-generated
# and never hand-edited — LAYOUT.md; a PR-per-row would be pure churn and contradicts
# the anti-merge-conflict rationale). main is protected by a ruleset that REQUIRES a PR;
# the default GITHUB_TOKEN push would be REJECTED. The chosen writer is a dedicated,
# repo-scoped GitHub App ("manifest-writer") added as the SINGLE non-human bypass actor
# on that ruleset (the other bypass actor is the Repository-admin role, for the
# maintainer's CLAUDE.md copy-edit carve-out). Why an App, not a PAT or a bot bypass:
# this push is a STANDING bypass of the load-bearing re-scan gate on a public
# sanitized-data repo, so the writer must be least-privilege (contents:write, this repo
# only), bot-attributed (auditable, not acting-as-admin), and revocable independently of
# any person's account. On a user-owned repo github-actions[bot] is not a selectable
# bypass actor, so the App is also the only clean mechanism. A ruleset bypass actor
# bypasses ALL rules in the ruleset, so when required status checks are later added the
# App's [skip ci] push will not deadlock against them.
#
# This job mints an installation token (actions/create-github-app-token) when the App is
# provisioned, and FALLS BACK to GITHUB_TOKEN when its vars/secrets are absent (pre-
# provisioning, or on forks) so the job still runs — that fallback push is exactly what a
# configured ruleset will (correctly) reject. The push step is fail-loud: a rejected push
# fails the job rather than leaving a stale index unnoticed; drift-check is the backstop.
#
# Provisioning + rotation: APP_ID lives in the repo variable MANIFEST_WRITER_APP_ID and
# the App's private key in the secret MANIFEST_WRITER_PRIVATE_KEY. To rotate, generate a
# new private key in the App's settings, replace the secret, then delete the old key —
# the running workflow picks up the new key on its next run with no code change.

on:
  push:
    branches: [main]
    paths:
      - "corpus/**"
      - "structural/**"
  schedule:
    # Weekly drift check (Mondays 06:00 UTC) — detection only, never heals.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: manifest-generate
  cancel-in-progress: false

jobs:
  generate:
    name: Generate + commit manifest rows
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Mint the manifest-writer App token (the single non-human ruleset bypass actor on
      # main, #35) when the App is provisioned; otherwise the step is skipped and every
      # `steps.app-token.outputs.*` is empty, so the job falls back to GITHUB_TOKEN below.
      # APP_ID is a repo variable (usable in `if:`); the private key is a secret.
      - name: Mint manifest-writer App token
        id: app-token
        if: ${{ vars.MANIFEST_WRITER_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.MANIFEST_WRITER_APP_ID }}
          private-key: ${{ secrets.MANIFEST_WRITER_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          # Full history so the per-path `git log --diff-filter=A` add-commit lookup
          # and the push-range diff both resolve.
          fetch-depth: 0
          # Push past main's PR-required ruleset using the App token when present; the
          # remote checkout configures is what `git push` below uses.
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: pip install -r ci/requirements.txt
      - name: Compute changed files in this push
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        # Three-dot is wrong here (we want what the push added, not vs. merge-base).
        # `before` is all-zeros for a brand-new branch's first push — fall back to the
        # empty tree so every path reads as added.
        run: |
          set -euo pipefail
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git hash-object -t tree /dev/null)"
          fi
          git diff --name-only "${BEFORE}" "${AFTER}" > changed-files.txt
          echo "Changed files in push:"; cat changed-files.txt
      - name: Generate manifest rows
        run: python3 ci/generate_manifest.py --changed-files changed-files.txt
      # Resolve the committer identity so manifest commits attribute to whichever token
      # actually pushes them: the App's own bot when provisioned, else github-actions[bot].
      - name: Resolve committer identity
        id: committer
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          if [ -n "${APP_SLUG}" ]; then
            uid="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
            echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
            echo "email=${uid}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"
          else
            echo "name=github-actions[bot]" >> "$GITHUB_OUTPUT"
            echo "email=41898282+github-actions[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit manifest if changed
        # Stage ONLY manifest.jsonl — this write-path bypasses the contribution gate
        # ([skip ci], push not PR), so it must never carry anything else to main.
        run: |
          set -euo pipefail
          if git diff --quiet -- manifest.jsonl; then
            echo "manifest.jsonl unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "${{ steps.committer.outputs.name }}"
          git config user.email "${{ steps.committer.outputs.email }}"
          git add manifest.jsonl
          git commit -m "chore(ci): index merged contribution(s) in manifest.jsonl [skip ci]"
          # Fail loud if the push is rejected (e.g. branch protection) — never swallow it.
          git push origin HEAD:main

  drift-check:
    name: Manifest drift check
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: pip install -r ci/requirements.txt
      - name: Assert manifest is in sync with the corpus on disk
        run: python3 ci/generate_manifest.py --check
